<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Browser Window Frame -->
  <rect x="10" y="20" width="100" height="88" rx="8" fill="url(#windowGrad)" stroke="#1e3a8a" stroke-width="2" />
  
  <!-- Window Controls -->
  <circle cx="22" cy="30" r="3" fill="#ef4444" />
  <circle cx="32" cy="30" r="3" fill="#fbbf24" />
  <circle cx="42" cy="30" r="3" fill="#10b981" />
  
  <!-- Main Content Area (Blank) -->
  <rect x="18" y="40" width="84" height="60" rx="4" fill="#ffffff" />
  
  <!-- Sidebar (Elevated) -->
  <g filter="url(#shadow)">
    <rect x="80" y="32" width="38" height="84" rx="6" fill="url(#sidebarGrad)" stroke="#1d4ed8" stroke-width="2" />
    
    <!-- Sidebar Details (Iconic representation) -->
    <rect x="88" y="44" width="22" height="4" rx="2" fill="#ffffff" fill-opacity="0.8" />
    <rect x="88" y="56" width="22" height="4" rx="2" fill="#ffffff" fill-opacity="0.8" />
    <rect x="88" y="68" width="22" height="4" rx="2" fill="#ffffff" fill-opacity="0.8" />
    
    <!-- Arrow pointing left into the sidebar -->
    <path d="M102 88 L94 88 L97 85 M94 88 L97 91" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
