<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab in Side</title>
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <div class="sidebar-container">
        <div class="toolbar" id="toolbar">
            <button id="add-url-btn" class="nav-btn" title="Add / Search URL">
                <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            <div class="v-divider"></div>
            <div id="quick-btns-container" style="display: flex; gap: 2px;">
                <!-- Buttons will be injected by sidebar.js -->
            </div>
            <div id="history-divider" class="v-divider" style="display: none;"></div>
            <div id="history-btns-container" style="display: flex; gap: 2px;">
                <!-- History buttons will be injected by sidebar.js -->
            </div>
            <div id="history-dropdown-container" class="dropdown-container" style="display: none;">
                <button id="history-dropdown-btn" class="nav-btn" title="More History">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                </button>
                <div id="history-dropdown-menu" class="dropdown-menu">
                    <!-- Overflow history items will be injected here -->
                </div>
            </div>
            
            <div class="divider"></div>
            <div id="actions-container" style="display: flex; gap: 2px;">
                <button id="reload-btn" class="nav-btn" title="Reload">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
                <button id="copy-link-btn" class="nav-btn" title="Copy Link">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
                <button id="open-tab-btn" class="nav-btn" title="Open in New Tab">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                </button>
                <button id="settings-btn" class="nav-btn" title="Settings">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
            </div>
        </div>
        <div class="content">
            <iframe id="main-frame" src="about:blank" frameborder="0"></iframe>
        </div>
        <div id="search-overlay" class="overlay" style="display: none;">
            <div class="overlay-content">
                <input type="text" id="search-input" placeholder="Enter URL or Search...">
                <div class="overlay-hints">Press Enter to Load / Search</div>
            </div>
        </div>
    </div>
    <div id="custom-tooltip" class="tooltip-container">
        <div class="tooltip-title"></div>
        <div class="tooltip-url"></div>
    </div>
    <script src="sidebar.js"></script>
</body>
</html>
